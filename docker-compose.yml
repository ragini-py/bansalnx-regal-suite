services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID:-rzp_test_dummy_key_id}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-977648781327-qbcho2u2o1f47kjkq872h1fhn15omhs4.apps.googleusercontent.com}
    container_name: bansalnx_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    env_file:
      - .env
    networks:
      bansalnx_network:
        aliases:
          - frontend

networks:
  bansalnx_network:
    name: bansalnx_network
    external: true
